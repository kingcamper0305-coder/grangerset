<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; padding: 12px; background: #0a0a0a; color: #fff; font-family: monospace; font-size: 12px; margin: 0; }
  h3 { margin: 0 0 8px; color: #e94560; font-size: 14px; }
  .status { padding: 6px 10px; border-radius: 4px; margin: 6px 0; }
  .active { background: rgba(0,200,100,0.2); border: 1px solid #0c6; }
  .inactive { background: rgba(200,0,0,0.2); border: 1px solid #c00; }
  button { width: 100%; padding: 8px; margin: 4px 0; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; cursor: pointer; font-family: monospace; }
  button:hover { background: #333; }
  #log { max-height: 120px; overflow-y: auto; background: #111; padding: 6px; border-radius: 4px; font-size: 10px; margin-top: 8px; }
</style>
</head>
<body>
<h3>⚡ Empire Bridge</h3>
<div id="statusBox" class="status inactive">Checking...</div>
<button id="toggleBtn">Start / Stop</button>
<div id="log"></div>
<script src="popup.js"></script>
</body>
</html>
