<!DOCTYPE html><html><head><title>Empire Bridge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="background:#0a0a0a;color:#fff;font-family:monospace;padding:10px;margin:0">
<h3>Empire Bridge</h3>
<div id="bar" style="display:flex;gap:5px;margin:10px 0">
<input id="url" type="text" value="https://freebitco.in/" style="flex:1;padding:8px;background:#222;color:#fff;border:1px solid #444;border-radius:4px">
<button onclick="go()" style="padding:8px 16px;background:#e94560;color:#fff;border:none;border-radius:4px">Go</button>
</div>
<iframe id="frame" src="about:blank" style="width:100%;height:70vh;border:1px solid #333;border-radius:4px"></iframe>
<div id="log" style="background:#111;padding:8px;margin-top:8px;max-height:100px;overflow-y:auto;font-size:11px;border-radius:4px"></div>
<script>
const log=document.getElementById('log');
const frame=document.getElementById('frame');
const urlInput=document.getElementById('url');
function addLog(m){log.innerHTML+=new Date().toLocaleTimeString()+' '+m+'<br>';log.scrollTop=log.scrollHeight}
function go(){frame.src=urlInput.value;addLog('Navigating: '+urlInput.value)}
addLog('Bridge active');

async function poll(){
  try{
    const r=await fetch('/poll');
    const cmd=await r.json();
    if(cmd.action){
      addLog('CMD: '+JSON.stringify(cmd).substring(0,80));
      let result;
      try{
        if(cmd.action==='goto'){frame.src=cmd.url;urlInput.value=cmd.url;result={ok:true}}
        else if(cmd.action==='eval'){result={ok:true,value:String(frame.contentWindow.eval(cmd.code)).substring(0,5000)}}
        else if(cmd.action==='click'){const el=frame.contentDocument.querySelector(cmd.sel);if(el){el.click();result={ok:true}}else result={ok:false,error:'not found'}}
        else if(cmd.action==='type'){const el=frame.contentDocument.querySelector(cmd.sel);if(el){el.value=cmd.text;result={ok:true}}else result={ok:false,error:'not found'}}
        else if(cmd.action==='info'){const doc=frame.contentDocument;result={ok:true,url:frame.src,title:doc.title,body:doc.body?.innerText?.substring(0,3000)||'no access (cross-origin)'}}
        else if(cmd.action==='screenshot'){result={ok:true,url:frame.src}}
        else result={ok:false,error:'unknown'};
      }catch(e){result={ok:false,error:e.message}}
      await fetch('/result',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(result)});
      addLog('R: '+JSON.stringify(result).substring(0,100));
    }
  }catch(e){addLog('Poll err')}
  setTimeout(poll,1500);
}
poll();
</script></body></html>
