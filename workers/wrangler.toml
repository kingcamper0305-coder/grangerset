# Granger Brain — Cloudflare Worker Configuration

name = "granger-brain"
main = "brain-worker.js"
compatibility_date = "2024-12-01"

# AI bindings
[ai]
binding = "AI"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "granger-data"
database_id = "5addbf68-3740-41fb-a1ce-1b82da7488e0"

# KV Namespace
[[kv_namespaces]]
binding = "STATE"
id = "a111e4c192374b80bd0a240e34c7cc91"

# R2 Bucket
[[r2_buckets]]
binding = "KNOWLEDGE"
bucket_name = "granger-knowledge"

# Vectorize
[[vectorize]]
binding = "MEMORIES"
index_name = "granger-memories"
