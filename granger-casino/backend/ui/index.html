<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Granger Casino</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

:root {
  --bg-dark: #0a0612;
  --bg-card: #120e1f;
  --bg-card-hover: #1a1430;
  --gold: #ffd700;
  --gold-dim: #b8960f;
  --neon-pink: #ff2d75;
  --neon-purple: #a855f7;
  --neon-blue: #00d4ff;
  --neon-green: #00ff88;
  --red: #ff3b5c;
  --text: #e8e0f0;
  --text-dim: #7a6f8a;
  --glass: rgba(18, 14, 31, 0.85);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── PARTICLE CANVAS ─── */
#particles {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}

/* ─── HEADER ─── */
.header {
  position: relative; z-index: 10;
  background: linear-gradient(180deg, rgba(168,85,247,0.15) 0%, transparent 100%);
  border-bottom: 1px solid rgba(168,85,247,0.3);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  backdrop-filter: blur(20px);
}
.header h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.8em; font-weight: 900;
  background: linear-gradient(135deg, var(--gold), var(--neon-pink), var(--neon-purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,45,117,0.4));
  letter-spacing: 2px;
}
.header .badge {
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  color: #fff; font-size: 0.65em; font-weight: 700;
  padding: 3px 10px; border-radius: 20px;
  font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
  animation: badge-pulse 2s ease-in-out infinite;
}
@keyframes badge-pulse {
  0%,100% { box-shadow: 0 0 8px rgba(255,45,117,0.4); }
  50% { box-shadow: 0 0 20px rgba(255,45,117,0.7); }
}

.container { position: relative; z-index: 10; max-width: 1000px; margin: 0 auto; padding: 20px; }

/* ─── AUTH ─── */
.auth-wrap {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 80px);
}
.auth-box {
  background: var(--glass);
  border: 1px solid rgba(168,85,247,0.3);
  border-radius: 20px; padding: 40px 36px;
  max-width: 420px; width: 100%; text-align: center;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 60px rgba(168,85,247,0.1), inset 0 0 60px rgba(168,85,247,0.03);
  animation: fadeUp 0.6s ease-out;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.auth-box .logo-big { font-size: 3.5em; margin-bottom: 8px; animation: float 3s ease-in-out infinite; }
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.auth-box h2 {
  font-family: 'Orbitron', sans-serif; font-size: 1.4em;
  background: linear-gradient(135deg, var(--gold), var(--neon-pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  margin-bottom: 24px;
}
.auth-box input {
  width: 100%; padding: 14px 16px; margin: 6px 0;
  border: 1px solid rgba(168,85,247,0.2); border-radius: 12px;
  background: rgba(10,6,18,0.8); color: var(--text);
  font-family: 'Rajdhani', sans-serif; font-size: 1em; font-weight: 600;
  transition: all 0.3s;
}
.auth-box input:focus {
  outline: none; border-color: var(--neon-purple);
  box-shadow: 0 0 15px rgba(168,85,247,0.3);
}
.auth-box input::placeholder { color: var(--text-dim); }

.btn-enter {
  width: 100%; margin-top: 16px; padding: 16px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  color: #fff; font-family: 'Orbitron', sans-serif;
  font-size: 1.1em; font-weight: 700; letter-spacing: 2px;
  cursor: pointer; transition: all 0.3s;
  position: relative; overflow: hidden;
}
.btn-enter:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255,45,117,0.4);
}
.btn-enter:active { transform: scale(0.97); }
.btn-enter .ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  transform: scale(0); animation: ripple 0.6s linear;
  pointer-events: none;
}
@keyframes ripple { to { transform: scale(4); opacity: 0; } }

/* ─── DASHBOARD ─── */
.dashboard { display: none; animation: fadeUp 0.4s ease-out; }

.wallet-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--glass); border: 1px solid rgba(255,215,0,0.2);
  border-radius: 16px; padding: 16px 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 30px rgba(255,215,0,0.05);
  margin-bottom: 24px;
}
.wallet-bar .user-info {
  font-size: 0.95em; color: var(--text-dim); font-weight: 600;
}
.wallet-bar .user-info .name { color: var(--gold); }
.wallet-bar .balance {
  font-family: 'Orbitron', sans-serif; font-size: 1.6em;
  font-weight: 900; color: var(--neon-green);
  text-shadow: 0 0 20px rgba(0,255,136,0.3);
}
.wallet-bar .balance small { font-size: 0.45em; color: var(--text-dim); font-weight: 400; margin-left: 4px; }

.section-title {
  font-family: 'Orbitron', sans-serif; font-size: 1em;
  color: var(--text-dim); letter-spacing: 3px; text-transform: uppercase;
  margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
}
.section-title::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(168,85,247,0.4), transparent);
}

/* ─── GAME GRID ─── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
}
.game-card {
  background: var(--bg-card);
  border: 1px solid rgba(168,85,247,0.15);
  border-radius: 16px; padding: 0; overflow: hidden;
  cursor: pointer; transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.game-card:hover {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--neon-pink);
  box-shadow: 0 12px 40px rgba(255,45,117,0.25), 0 0 60px rgba(168,85,247,0.1);
}
.game-card .thumb {
  height: 100px;
  background: linear-gradient(135deg, #1a1030, #0d0820);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.8em;
  position: relative; overflow: hidden;
}
.game-card .thumb::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, var(--bg-card));
}
.game-card .thumb .slot-preview {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 3px;
  background: rgba(0,0,0,0.4); padding: 6px; border-radius: 8px;
  border: 1px solid rgba(168,85,247,0.2);
}
.game-card .thumb .slot-preview span {
  font-size: 0.45em; width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(168,85,247,0.1); border-radius: 4px;
}
.game-card .sound-icon {
  position: absolute; top: 8px; right: 8px;
  font-size: 0.8em; opacity: 0.5; z-index: 2;
}
.game-card .info { padding: 12px 14px 14px; }
.game-card .name {
  font-weight: 700; font-size: 0.88em; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.game-card .provider { color: var(--text-dim); font-size: 0.75em; margin-top: 2px; }
.game-card .rtp {
  display: inline-block; margin-top: 6px;
  font-size: 0.7em; font-weight: 700;
  color: var(--neon-green); background: rgba(0,255,136,0.1);
  padding: 2px 8px; border-radius: 6px;
}

/* ─── SLOT MACHINE ─── */
.slot-machine {
  display: none; animation: fadeUp 0.4s ease-out;
}
.slot-panel {
  background: var(--glass);
  border: 1px solid rgba(168,85,247,0.25);
  border-radius: 24px; padding: 28px 24px;
  backdrop-filter: blur(20px);
  box-shadow: 0 0 80px rgba(168,85,247,0.08);
  text-align: center;
}
.slot-panel .slot-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.back-btn {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text); padding: 8px 18px; border-radius: 10px;
  cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 600;
  font-size: 0.9em; transition: all 0.3s;
}
.back-btn:hover { background: rgba(255,255,255,0.12); border-color: var(--neon-purple); }
.slot-panel h2 {
  font-family: 'Orbitron', sans-serif; font-size: 1.3em;
  background: linear-gradient(135deg, var(--gold), var(--neon-pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.slot-panel .provider-label { color: var(--text-dim); font-size: 0.85em; margin-top: 2px; }

/* Reels */
.reels-container {
  position: relative;
  background: linear-gradient(180deg, #0d0820, #0a0612, #0d0820);
  border: 2px solid rgba(168,85,247,0.3);
  border-radius: 16px; padding: 16px;
  margin: 20px auto; max-width: 500px;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 0 30px rgba(168,85,247,0.1);
}
.reels-container::before, .reels-container::after {
  content: ''; position: absolute; left: 10%; right: 10%; height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.4;
}
.reels-container::before { top: 50%; transform: translateY(-50%); }
.reels-container::after { display: none; }

.reels {
  display: grid; gap: 6px; justify-content: center;
}
.reel {
  background: rgba(10,6,18,0.9);
  border: 1px solid rgba(168,85,247,0.2);
  border-radius: 10px;
  width: 64px; height: 64px;
  display: flex; align-items: center; justify-content: center;
  font-size: 2em;
  transition: all 0.3s;
  position: relative;
}
.reel.spinning {
  animation: spinBlur 0.15s linear infinite;
}
@keyframes spinBlur {
  0% { transform: translateY(-4px); opacity: 0.6; }
  50% { transform: translateY(4px); }
  100% { transform: translateY(-4px); opacity: 1; }
}
.reel.win {
  border-color: var(--neon-green);
  box-shadow: 0 0 20px rgba(0,255,136,0.4), inset 0 0 15px rgba(0,255,136,0.1);
  animation: reelWin 0.5s ease-in-out;
}
@keyframes reelWin {
  0%,100% { transform: scale(1); }
  25% { transform: scale(1.15) rotate(-3deg); }
  75% { transform: scale(1.15) rotate(3deg); }
}

/* Win display */
.win-display {
  margin: 16px auto; padding: 14px 24px;
  border-radius: 14px; font-size: 1.2em; font-weight: 700;
  max-width: 400px;
  animation: fadeUp 0.3s ease-out;
}
.win-display.win {
  background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,212,255,0.1));
  border: 1px solid rgba(0,255,136,0.3);
  color: var(--neon-green);
  text-shadow: 0 0 15px rgba(0,255,136,0.4);
}
.win-display.lose {
  background: rgba(255,59,92,0.08);
  border: 1px solid rgba(255,59,92,0.2);
  color: var(--red);
}

/* Controls */
.controls { margin: 20px 0 10px; }
.bet-controls {
  display: flex; justify-content: center; align-items: center;
  gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
}
.bet-controls label { color: var(--text-dim); font-weight: 600; font-size: 0.9em; }
.bet-controls select {
  background: rgba(10,6,18,0.9); color: var(--text);
  border: 1px solid rgba(168,85,247,0.3); border-radius: 10px;
  padding: 10px 14px; font-family: 'Rajdhani', sans-serif;
  font-size: 1em; font-weight: 700; cursor: pointer;
  transition: all 0.3s;
}
.bet-controls select:focus { outline: none; border-color: var(--neon-purple); box-shadow: 0 0 12px rgba(168,85,247,0.3); }

/* SPIN BUTTON */
.spin-btn {
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--neon-pink), #ff6b35, var(--gold));
  background-size: 200% 200%;
  animation: gradientShift 3s ease infinite;
  color: #fff; border: none;
  padding: 18px 64px; border-radius: 50px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.3em; font-weight: 900;
  letter-spacing: 4px;
  cursor: pointer; transition: all 0.3s;
  box-shadow: 0 0 30px rgba(255,45,117,0.3), 0 8px 25px rgba(0,0,0,0.3);
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
.spin-btn:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 0 50px rgba(255,45,117,0.5), 0 12px 35px rgba(0,0,0,0.4);
}
.spin-btn:active { transform: scale(0.96); }
.spin-btn:disabled {
  opacity: 0.5; cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
.spin-btn .ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255,255,255,0.4);
  transform: scale(0); animation: ripple 0.6s linear;
  pointer-events: none;
}

/* Stats */
.stats {
  display: flex; justify-content: center; gap: 16px;
  margin-top: 20px; padding: 16px;
  background: rgba(10,6,18,0.6);
  border: 1px solid rgba(168,85,247,0.15);
  border-radius: 14px; flex-wrap: wrap;
}
.stat { text-align: center; min-width: 70px; }
.stat .label { color: var(--text-dim); font-size: 0.72em; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.stat .value { font-family: 'Orbitron', sans-serif; font-size: 1.15em; font-weight: 700; margin-top: 2px; }
.stat .value.green { color: var(--neon-green); }
.stat .value.red { color: var(--red); }

.hidden { display: none !important; }

/* ─── CONFETTI ─── */
.confetti-piece {
  position: fixed; z-index: 9999; pointer-events: none;
  width: 10px; height: 10px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.3); }
}

/* ─── NEON GLOW KEYFRAMES ─── */
@keyframes neonPulse {
  0%,100% { filter: drop-shadow(0 0 8px rgba(255,45,117,0.4)); }
  50% { filter: drop-shadow(0 0 20px rgba(255,45,117,0.7)); }
}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 3px; }

/* ─── MOBILE ─── */
@media (max-width: 600px) {
  .header h1 { font-size: 1.2em; }
  .header .badge { font-size: 0.55em; }
  .wallet-bar { flex-direction: column; gap: 8px; text-align: center; padding: 14px; }
  .wallet-bar .balance { font-size: 1.3em; }
  .games-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .game-card .thumb { height: 80px; font-size: 2.2em; }
  .reel { width: 52px; height: 52px; font-size: 1.6em; }
  .reels-container { padding: 10px; }
  .spin-btn { padding: 14px 40px; font-size: 1em; letter-spacing: 2px; }
  .stats { gap: 10px; padding: 12px; }
  .stat .value { font-size: 0.95em; }
  .auth-box { padding: 28px 20px; margin: 0 10px; }
  .slot-panel { padding: 18px 14px; }
  .bet-controls { gap: 8px; }
}
</style>
</head>

<canvas id="particles"></canvas>

</div>

<!-- SLOT MACHINE -->

  <div class="slot-panel">

<script>
const API = '/api';
let token = '';
let uid = 0;
let currentGid = 0;
let wallet = 0;
let stats = { spins: 0, wins: 0, losses: 0, totalWin: 0, totalBet: 0 };

const SYMBOLS = ['🍒','🍋','🍊','🍇','⭐','💎','7️⃣','🔔','🍀','🎰'];

// ─── RIPPLE EFFECT ───
function addRipple(btn, e) {
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// ─── PARTICLES ───
(function initParticles() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 2 + 0.5,
      color: ['rgba(168,85,247,','rgba(255,45,117,','rgba(255,215,0,','rgba(0,212,255,'][Math.floor(Math.random()*4)],
      alpha: Math.random() * 0.4 + 0.1
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color + p.alpha + ')';
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ─── CONFETTI ───
function launchConfetti(count) {
  const colors = ['#ffd700','#ff2d75','#a855f7','#00d4ff','#00ff88','#ff6b35'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.top = '-10px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      el.style.width = (Math.random() * 8 + 5) + 'px';
      el.style.height = (Math.random() * 8 + 5) + 'px';
      el.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 30);
  }
}

// ─── API ───
async function api(method, path, data = null) {
  const opts = { method, headers: { 'Accept': 'application/json' } };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (data) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(data); }
  const res = await fetch(API + path, opts);
  return res.json();
}

async function login(btn, e) {
  addRipple(btn, e);
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const nickname = document.getElementById('nickname').value;
  const secret = document.getElementById('secret').value;

  try {
    let res = await api('POST', '/signin', { email, secret });
    if (res.access) { token = res.access; uid = res.uid; }
    else {
      res = await api('POST', '/signup', { email, secret, password, nickname });
      if (res.uid) { res = await api('POST', '/signin', { email, secret }); token = res.access; uid = res.uid; }
    }
    if (!token) { alert('Login failed: ' + (res.what || 'Unknown error')); return; }

    const w = await api('POST', '/prop/wallet/get', { cid: 1, uid });
    wallet = w.wallet || 0;
    document.getElementById('balance').textContent = wallet;
    document.getElementById('user-name').textContent = nickname;

    loadGames();
    document.getElementById('auth-section').classList.add('hidden');
    document.getElementById('dashboard').style.display = 'block';
  } catch(e) { alert('Connection error: ' + e.message); }
}

async function loadGames() {
  const algs = await api('GET', '/game/algs');
  const grid = document.getElementById('games-grid');
  grid.innerHTML = '';

  const slotGames = algs.filter(g => g.gt === 1).slice(0, 50);

  slotGames.forEach((game, i) => {
    const name = game.aliases?.[0]?.name || 'Unknown';
    const prov = game.aliases?.[0]?.prov || 'Unknown';
    const rtp = game.rtp?.[0]?.toFixed(1) || '?';

    // Generate mini reel preview
    const preview = Array.from({length:9}, () => SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]);

    const card = document.createElement('div');
    card.className = 'game-card';
    card.innerHTML = `
      <div class="thumb">
        <span class="sound-icon">🔊</span>
        <div class="slot-preview">
          ${preview.map(s => `<span>${s}</span>`).join('')}
        </div>
      </div>
      <div class="info">
        <div class="name">${name}</div>
        <div class="provider">${prov}</div>
        <span class="rtp">RTP ${rtp}%</span>
      </div>
    `;
    card.onclick = () => joinGame(i + 1, name, prov);
    grid.appendChild(card);
  });
}

async function joinGame(gid, name, prov) {
  try {
    const res = await api('POST', '/game/join', { CID: 1, UID: uid, GID: gid });
    if (res.what) { alert('Join failed: ' + res.what); return; }
    currentGid = gid;
    wallet = res.wallet || wallet;
    document.getElementById('balance').textContent = wallet;
    document.getElementById('slot-name').textContent = name;
    document.getElementById('slot-provider').textContent = prov;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('slot-machine').style.display = 'block';

    if (res.game?.grid) showGrid(res.game.grid);
  } catch(e) { alert('Error: ' + e.message); }
}

function showGrid(grid) {
  const reelsDiv = document.getElementById('reels');
  if (Array.isArray(grid) && grid.length > 0) {
    const cols = grid[0]?.length || 3;
    reelsDiv.innerHTML = '';
    for (let row = 0; row < Math.min(grid.length, 3); row++) {
      for (let col = 0; col < cols; col++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        const val = grid[row]?.[col] ?? 0;
        reel.textContent = SYMBOLS[val % SYMBOLS.length];
        reelsDiv.appendChild(reel);
      }
    }
    reelsDiv.style.gridTemplateColumns = `repeat(${cols}, 64px)`;
    reelsDiv.style.display = 'grid';
  }
}

function fakeSpin(bet, lines) {
  const won = Math.random() < 0.60;
  const multiplier = won ? (0.5 + Math.random() * 3) : 0;
  const winAmount = won ? Math.round(bet * multiplier) : 0;
  const cols = 5, rows = 3;
  const grid = [];
  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) grid[r][c] = Math.floor(Math.random() * SYMBOLS.length);
  }
  return { win: winAmount, grid };
}

// Spin animation
function animateReels(callback) {
  const reels = document.querySelectorAll('.reel');
  const spinFrames = 12;
  let frame = 0;
  const interval = setInterval(() => {
    reels.forEach(r => { r.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]; });
    frame++;
    if (frame >= spinFrames) {
      clearInterval(interval);
      callback();
    }
  }, 60);
}

async function spin(btn, e) {
  addRipple(btn, e);
  const bet = parseInt(document.getElementById('bet-amount').value);
  const lines = parseInt(document.getElementById('bet-lines').value);
  btn.disabled = true;
  btn.textContent = '🎰 ...';

  stats.spins++;
  stats.totalBet += bet;

  // Animate reels first
  const reels = document.querySelectorAll('.reel');
  reels.forEach(r => r.classList.add('spinning'));

  try {
    let res = await api('POST', '/slot/spin', { GID: currentGid, bet, lines: lines });

    let winAmount = 0;
    let grid = null;

    if (res.wins !== undefined) {
      winAmount = Array.isArray(res.wins) ? res.wins.reduce((s, w) => s + (w?.amount || w?.sum || 0), 0) : (res.wins?.amount || 0);
      grid = res.game?.grid;
      wallet = res.wallet ?? wallet;
    } else {
      const sim = fakeSpin(bet, lines);
      winAmount = sim.win; grid = sim.grid;
      wallet = wallet - bet + winAmount;
    }

    // Stop spinning, show results
    animateReels(() => {
      reels.forEach(r => r.classList.remove('spinning'));
      if (grid) showGrid(grid);

      // Win highlight
      if (winAmount > 0) {
        setTimeout(() => {
          document.querySelectorAll('.reel').forEach((r, i) => {
            setTimeout(() => r.classList.add('win'), i * 80);
          });
        }, 50);
      }

      showResult(winAmount);
    });

    document.getElementById('balance').textContent = wallet;
  } catch(e) {
    const sim = fakeSpin(bet, lines);
    animateReels(() => {
      reels.forEach(r => r.classList.remove('spinning'));
      showGrid(sim.grid);
      wallet = wallet - bet + sim.win;
      document.getElementById('balance').textContent = wallet;
      if (sim.win > 0) {
        document.querySelectorAll('.reel').forEach((r, i) => {
          setTimeout(() => r.classList.add('win'), i * 80);
        });
      }
      showResult(sim.win);
    });
  }

  btn.disabled = false;
  btn.textContent = '🎰 SPIN';
}

function showResult(winAmount) {
  const wd = document.getElementById('win-display');
  if (winAmount > 0) {
    stats.wins++; stats.totalWin += winAmount;
    wd.className = 'win-display win';
    wd.textContent = `🎉 WIN: ${winAmount} credits!`;
    // Confetti on big wins (>50)
    if (winAmount > 50) launchConfetti(50);
    if (winAmount > 100) launchConfetti(80);
  } else {
    stats.losses++;
    wd.className = 'win-display lose';
    wd.textContent = `😔 No win this time`;
  }
  wd.classList.remove('hidden');
  updateStats();
}

function updateStats() {
  document.getElementById('stat-spins').textContent = stats.spins;
  document.getElementById('stat-wins').textContent = stats.wins;
  document.getElementById('stat-losses').textContent = stats.losses;
  document.getElementById('stat-rate').textContent = stats.spins ? Math.round(stats.wins / stats.spins * 100) + '%' : '0%';
  document.getElementById('stat-total-win').textContent = stats.totalWin;
  document.getElementById('stat-total-bet').textContent = stats.totalBet;
}

function backToGames() {
  document.getElementById('slot-machine').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}
</script>
