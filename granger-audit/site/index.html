<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granger Audit — Security Scanner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Courier New',monospace;min-height:100vh}
.container{max-width:800px;margin:0 auto;padding:40px 20px}
h1{color:#00ff88;font-size:2em;margin-bottom:5px}
.subtitle{color:#666;margin-bottom:30px;font-size:0.9em}
.input-group{margin-bottom:20px}
label{display:block;color:#00ff88;margin-bottom:8px;font-size:0.9em}
input,select,textarea{width:100%;padding:12px;background:#1a1a2e;border:1px solid #333;color:#fff;border-radius:6px;font-family:inherit;font-size:14px}
input:focus,textarea:focus{border-color:#00ff88;outline:none}
textarea{height:100px;resize:vertical}
.btn{background:#00ff88;color:#0a0a0f;border:none;padding:14px 28px;border-radius:6px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:bold;width:100%;margin-top:10px}
.btn:hover{background:#00cc6a}
.btn:disabled{background:#333;color:#666;cursor:not-allowed}
.results{margin-top:30px;background:#1a1a2e;border-radius:8px;padding:20px;display:none}
.results.active{display:block}
.result-header{color:#00ff88;margin-bottom:15px;font-size:1.2em}
.result-content{white-space:pre-wrap;font-size:13px;line-height:1.6;color:#ccc}
.loading{text-align:center;color:#00ff88;padding:20px}
.loading::after{content:'';animation:dots 1.5s infinite}
@keyframes dots{0%,20%{content:'.'}40%{content:'..'}60%,100%{content:'...'}}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:8px}
.badge-critical{background:#ff4444;color:#fff}
.badge-warning{background:#ffaa00;color:#000}
.badge-safe{background:#00ff88;color:#000}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{padding:10px 20px;background:#1a1a2e;border:1px solid #333;border-radius:6px;cursor:pointer;color:#888}
.tab.active{border-color:#00ff88;color:#00ff88}
.pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:40px}
.plan{background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:20px;text-align:center}
.plan h3{color:#00ff88;margin-bottom:10px}
.plan .price{font-size:2em;color:#fff;margin-bottom:10px}
.plan .price span{font-size:0.5em;color:#666}
</style>
</head>
<body>
<div class="container">
  <h1>🧠 GRANGER AUDIT</h1>
  <p class="subtitle">AI-Powered Security Scanner — Powered by Qwen QwQ-32B</p>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('scan')">🔍 Scan</div>
    <div class="tab" onclick="switchTab('analyze')">🧮 Analyze</div>
    <div class="tab" onclick="switchTab('solve')">🎯 Solve</div>
  </div>

  <div id="tab-scan">
    <div class="input-group">
      <label>Target URL</label>
      <input type="text" id="target" placeholder="https://example.com" />
    </div>
    <div class="input-group">
      <label>Scan Type</label>
      <select id="scan-type">
        <option value="quick">Quick Scan (ports + headers)</option>
        <option value="full">Full Audit (ports + vulns + config)</option>
        <option value="deep">Deep Scan (everything + AI analysis)</option>
      </select>
    </div>
    <button class="btn" onclick="runScan()">⚡ START AUDIT</button>
  </div>

  <div id="tab-analyze" style="display:none">
    <div class="input-group">
      <label>What to analyze</label>
      <textarea id="analyze-input" placeholder="Paste code, config, logs, or describe a system..."></textarea>
    </div>
    <button class="btn" onclick="runAnalyze()">🔬 ANALYZE</button>
  </div>

  <div id="tab-solve" style="display:none">
    <div class="input-group">
      <label>Problem</label>
      <textarea id="solve-input" placeholder="Describe the security problem or vulnerability..."></textarea>
    </div>
    <div class="input-group">
      <label>Constraints (optional)</label>
      <input type="text" id="solve-constraints" placeholder="no downtime, must be backwards compatible..." />
    </div>
    <button class="btn" onclick="runSolve()">🎯 SOLVE</button>
  </div>

  <div class="results" id="results">
    <div class="result-header" id="result-title"></div>
    <div class="result-content" id="result-content"></div>
  </div>

  <div class="pricing">
    <div class="plan">
      <h3>Free</h3>
      <div class="price">$0<span>/mo</span></div>
      <p>100 scans/day<br>5/min rate limit</p>
    </div>
    <div class="plan">
      <h3>Pro</h3>
      <div class="price">$19<span>/mo</span></div>
      <p>10,000 scans/day<br>60/min rate limit</p>
    </div>
    <div class="plan">
      <h3>Business</h3>
      <div class="price">$99<span>/mo</span></div>
      <p>100,000 scans/day<br>300/min rate limit</p>
    </div>
  </div>
</div>

<script>
const BRAIN = 'https://granger-brain.kingcamper0305-c6f.workers.dev';

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).style.display = 'block';
}

function showResults(title, content) {
  const r = document.getElementById('results');
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-content').textContent = content;
  r.classList.add('active');
}

function showLoading() {
  const r = document.getElementById('results');
  document.getElementById('result-title').textContent = '⏳ Scanning...';
  document.getElementById('result-content').innerHTML = '<div class="loading">Running audit</div>';
  r.classList.add('active');
}

async function callBrain(endpoint, data) {
  const res = await fetch(BRAIN + endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return res.json();
}

async function runScan() {
  const target = document.getElementById('target').value;
  const type = document.getElementById('scan-type').value;
  if (!target) return alert('Enter a target URL');

  showLoading();
  try {
    const data = await callBrain('/analyze', {
      input: `Security audit of ${target}. Scan type: ${type}. Check for: open ports, SSL/TLS config, security headers, common vulnerabilities, misconfigurations. Provide findings with severity ratings.`,
      depth: type === 'deep' ? 'deep' : 'shallow'
    });
    showResults('🔍 Audit: ' + target, JSON.stringify(data.analysis, null, 2));
  } catch(e) {
    showResults('❌ Error', e.message);
  }
}

async function runAnalyze() {
  const input = document.getElementById('analyze-input').value;
  if (!input) return alert('Enter something to analyze');

  showLoading();
  try {
    const data = await callBrain('/analyze', { input, depth: 'deep' });
    showResults('🔬 Analysis', JSON.stringify(data.analysis, null, 2));
  } catch(e) {
    showResults('❌ Error', e.message);
  }
}

async function runSolve() {
  const problem = document.getElementById('solve-input').value;
  const constraints = document.getElementById('solve-constraints').value;
  if (!problem) return alert('Describe the problem');

  showLoading();
  try {
    const data = await callBrain('/solve', {
      problem,
      constraints: constraints ? constraints.split(',').map(c => c.trim()) : []
    });
    showResults('🎯 Solution', JSON.stringify(data.solution, null, 2));
  } catch(e) {
    showResults('❌ Error', e.message);
  }
}
</script>
</body>
</html>
